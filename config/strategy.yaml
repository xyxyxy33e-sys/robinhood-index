# SPY 7DTE index options strategy — all tunable parameters.
# The scheduled session reads this file at 9:00 ET every trading day.

# dry_run: full signal pipeline + journaling, but NO orders are placed.
# live:    orders are placed automatically within the limits below.
#          Setting "live" is the account owner's standing authorization for
#          scheduled agent sessions to trade without per-order confirmation.
mode: live      # TEMPORARY: switched from dry_run 2026-08-04 09:2x ET by explicit owner
                # request, for TODAY (2026-08-04) ONLY. Revert to dry_run at end of session
                # (after Phase 6) regardless of today's outcome. Original dry_run rationale
                # (set 2026-07-24 by the owner) still applies going forward: the 7DTE /
                # multi-day-hold / no-hard-close structure has NO backtest support as a
                # whole, and the underlying signal lost money out-of-sample (June: -$5,100).

account_number: "576391551"   # Robinhood "Agentic" cash account (agentic_allowed=true, option_level_2)
timezone: America/New_York

# SINGLE symbol. June out-of-sample showed SPY/QQQ/IWM scores cross the threshold
# together (same market factor), so a 3-symbol book was one leveraged bet that
# stopped out as a unit. SPY chosen: tightest 0DTE spreads (lowest unmodeled
# slippage) and it traded 37% less often than QQQ at the same threshold.
# June per-symbol: SPY -$1,009 (19 trades) · QQQ -$1,379 (30) · IWM -$2,712 (33).
universe: [SPY]

schedule:            # all times US/Eastern
  sentiment_start: "09:00"
  market_open: "09:30"
  entry_earliest: "09:45"   # owner's choice. Backtest 07/13-07/24 across 9:35/9:45/9:50/10:00
                            # was inconclusive (spread was noise); 9:35 is the one ruled OUT
                            # structurally — one bar makes drive/range_pos pure noise.
  entry_latest: "11:30"     # no new entries after this
  # HARD CLOSE REMOVED (owner decision). Positions are no longer flattened intraday;
  # they are held across sessions and exited by stop / target / time-stop (see risk:).
  eod_verify: "15:45"       # before the close: confirm every open position has a
                            # WORKING GTC stop, and check the time-stop / DTE rules.
  failsafe_check: "16:10"   # after the close: independent re-verification

signal:
  entry_threshold: 40       # |symbol score| needed to trade that symbol (score range -100..+100)
  gap_limit_pct: 1.5        # skip the day if overnight gap exceeds this (unstable regime)
  vix_max: 35               # skip the day if VIX is above this
  per_symbol_entries: true  # each universe symbol qualifies independently, in its own direction
  # allow_mixed_directions is moot with a single-symbol universe (one position at a time).
  velocity_watch_pts_per_min: 1.0  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** score
                             # rate-of-change (points/minute) worth flagging in the journal.
                             # Added 2026-07-27: the level-only gate (entry_threshold) missed a
                             # real, fast -21.8 -> -30.6 move in 12 min because it never crossed
                             # +/-40. Unvalidated starting guess, not a tuned threshold — see
                             # `strategy_calc.py velocity` and logs/backtest/ once evidence exists.
  acceleration_watch_pts_per_min2: 0.5  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** 2nd
                             # derivative — change in velocity per minute (points/min^2).
                             # Flags when a move is speeding up or reversing, not just moving.
                             # Also an unvalidated starting guess — see `strategy_calc.py velocity
                             # --velocity-prev`.
  option_velocity_watch_usd_per_min: 0.01    # *** DIAGNOSTIC, DOES NOT GATE ANYTHING ***
                             # same velocity/acceleration math, applied to 0DTE call AND put
                             # MID PRICE (dollars, not -100..100 points — hence separate
                             # thresholds; pass via `velocity --watch-threshold`). Tracked
                             # every flat re-check for BOTH directions regardless of which
                             # way the sentiment score points — extends the existing
                             # shadow-0DTE-leg snapshot into a continuous forward series.
                             # Lowered from 0.05 on 2026-07-28 (owner request): the original
                             # threshold filtered out most of that session's real but modest
                             # cycle-to-cycle moves (e.g. -0.016, +0.0425, +0.03 $/min all
                             # went unlogged 10:16-11:20), leaving a gap in the record even
                             # though the underlying moved substantially in that window.
                             # Still not zero — a leg with a truly unchanged quote between
                             # polls stays unlogged, but real movement should now show up.
  option_acceleration_watch_usd_per_min2: 0.005  # as above, 2nd derivative; lowered from
                             # 0.02 on 2026-07-28 for the same reason.

risk:
  max_premium_per_trade_usd: 1000  # max premium outlay on one position
  max_concurrent_positions: 1      # single-symbol universe -> at most one open position
  max_total_premium_usd: 1000      # equals the per-position cap now (only one position can be open)
  max_trades_per_day: 6
  daily_loss_halt_usd: 1000        # ~3.3 full stops at $1,000 sizing (a full stop is ~$300),
                                   # so the halt binds well before the 6-entry cap.
  stop_loss_pct: 30                # core rule: close the position at a 30% loss
  stop_trigger_frac: 0.72          # resting stop triggers at 72% of fill (-28%, margin for slippage)
  stop_time_in_force: gtc          # *** CRITICAL *** With no hard close, the resting stop is the
                                   # ONLY protection on an open position. A gfd stop would expire
                                   # at the close and leave the position naked overnight.
  max_hold_trading_days: 3         # time stop: exit by 13:30 ET on the 3rd trading day after entry
  min_dte_at_exit: 3               # and never hold a contract below 3 DTE (theta cliff / 0DTE risk),
                                   # whichever comes first.
  # No limit floor: the resting stop is a stop-MARKET order. A stop-limit can gap
  # straight through its floor and never fill, leaving the position unprotected;
  # stop-market guarantees the exit at an unbounded price. Fill > no fill.
  take_profit_pct: 30              # *** HARD EXIT, same mechanism as the old +60% ***
                                   # monitored (not resting — one working sell order at a time).
                                   # Lowered from 60 on 2026-07-29 (owner request) after that
                                   # day's SPY 740P: +40.6% unrealized at 12:15 ET round-tripped
                                   # all the way to a -28.96% stop-out by 14:45 ET on an FOMC-
                                   # driven reversal. +60% was set from the July 0DTE backtest
                                   # (logs/backtest/2026-07-13_to_2026-07-24.md), where median
                                   # MFE was only +13.4% at 7DTE and the +60% target was reached
                                   # just 2/19 times — i.e. it was already rarely the binding
                                   # exit; most trades ran to time/DTE. Retested June+July 2026
                                   # on regenerated real-data SPY 7DTE trades: supportive on June
                                   # (+$124 vs -$1,371 counterfactual under +60%), null on July
                                   # (nothing ever got close to either target that week) — see
                                   # logs/backtest/take_profit_30pct_test.md. 22 trades, thin;
                                   # not treated as settled.
  consider_exit_pct: 10            # *** REAL, GATING RULE as of 2026-07-30 (owner decision) ***
                                   # first unrealized-gain checkpoint. Was diagnostic-only
                                   # 2026-07-29 -> 2026-07-30 (logged, never acted on); promoted
                                   # to a real trailing-stop ACTIVATION trigger after the
                                   # 2026-07-30 SPY 738C crossed +10% at 13:01 ET and did not
                                   # exit until +32% five hours later — a live case for capturing
                                   # some of that gap rather than only journaling it. Once
                                   # unrealized gain first crosses this level, the resting stop
                                   # tightens off the -28% floor to trail the peak — see
                                   # `trail_stop_distance_pct` below and `strategy_calc.py stops
                                   # --fill F --peak P`. Still an unvalidated starting guess, not
                                   # a tuned threshold — zero backtest evidence for +10% as an
                                   # activation level, same caveat as velocity_watch_pts_per_min
                                   # above; only now it gates something real, so re-tune if it
                                   # proves too trigger-happy.
  trail_stop_distance_pct: 14      # *** REAL, GATING RULE, added 2026-07-30 (owner decision) ***
                                   # once the trailing stop is active (see consider_exit_pct),
                                   # the effective stop sits this many percentage points (of
                                   # fill-relative gain) behind the highest unrealized gain
                                   # reached since activation, and only ever moves up. Chosen as
                                   # half of the original -28% stop width (stop_trigger_frac) —
                                   # tighter than the initial stop since it is now protecting
                                   # profit rather than absorbing entry volatility, but with
                                   # enough room to avoid getting shaken out by ordinary chop.
                                   # Unvalidated starting guess, zero backtest evidence, same
                                   # caveat as consider_exit_pct above.

monitoring:
  interval_open_minutes: 1    # wake every minute while any position is open
  interval_flat_minutes: 1    # signal re-checks every minute when flat, same as when open

contract:
  # SHADOW LEG (dry-run diagnostic, never traded): for every signal, also record the
  # equivalent contract at this DTE so the 0DTE-vs-7DTE question gets answered on
  # forward out-of-sample data. The June comparison (logs/backtest/dte_comparison.md)
  # favoured 7DTE, but June was mean-reverting while July's best days came from 0DTE
  # convexity — that ranking is likely regime-dependent and needs fresh evidence.
  shadow_dte: 0             # set to null to stop recording the shadow leg
  dte_target: 7             # nearest expiration >= 7 CALENDAR days out (was 0DTE).
                            # If +7 is a weekend/holiday, take the next available
                            # expiration; never take one below dte_target - 1.
  min_premium: 0.15         # skip contracts under $0.15/share — fills are spread-dominated
  target_delta_min: 0.45    # at 7DTE this is ~1-2 strikes OTM — the contracts actually
  target_delta_max: 0.55    # tested in logs/backtest/dte_comparison.md. Use real greeks
                            # from get_option_quotes; do not reuse the 0DTE strike offsets.
  max_spread_pct_of_mid: 10 # skip contracts with wide bid/ask
  min_open_interest: 500
  min_volume: 100

cash_account:
  fund_only_from_settled_cash: true   # size against start-of-day settled cash
  no_reuse_of_same_day_proceeds: true # avoid good-faith violations

journal:
  branch: claude/robinhood-day-options-strategy-y8eskp
  dir: logs/journal
