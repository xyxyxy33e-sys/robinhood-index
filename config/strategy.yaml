# SPY 7DTE index options strategy — all tunable parameters.
# The scheduled session reads this file at 9:00 ET every trading day.

# dry_run: full signal pipeline + journaling, but NO orders are placed.
# live:    orders are placed automatically within the limits below.
#          Setting "live" is the account owner's standing authorization for
#          scheduled agent sessions to trade without per-order confirmation.
mode: dry_run   # Reverted 2026-08-12 15:46 ET (Phase 6) per the standing end-of-day
                # agreement: the 2026-08-12 live window was explicit, owner-directed
                # in-session ("turn today into live run"), and scoped to that day only.
                # Result: 0 real trades — the entry window closed 11:30 ET with 0/6
                # qualifying signals despite an eventful morning (strong CPI-driven
                # premarket gap +52.3, full gap-and-crap fade, whipsaw price action, a
                # sharp flash-down spike at 10:31 ET) — SPY's score never crossed +/-40
                # at any point. Live mode was available and correctly unused; account
                # confirmed flat and clean at Phase 5/6. This is the persistence gate's
                # (P=3, live since 8/10) first live-mode day and it still has not seen a
                # completed forward entry under the current rule set. Original dry_run
                # rationale (set 2026-07-24 by the owner) still applies as the default:
                # the 7DTE / multi-day-hold / no-hard-close structure has NO backtest
                # support as a whole, and the underlying signal lost money out-of-sample
                # (June: -$5,100). Every live window requires the same explicit, scoped,
                # one-day approval — not a standing switch.
                #
                # --- history ---
                # Reverted 2026-08-04 16:10 ET (Phase 6) per the standing end-of-day
                # agreement: the 2026-08-04 live window was explicit, owner-approved, and
                # scoped to that day only. Result: 2 real trades, both take_profit winners
                # (SPY 8/11 766C +$258.00, SPY 8/11 767C +$182.00; total +$440.00), account
                # confirmed flat and clean at Phase 5/6. One good live day does not change
                # the underlying evidence picture — see the 2026-08-04 conversation log for
                # the full discussion (tiny sample, trailing stop never tested through an
                # actual reversal, June out-of-sample loss, reactive-tuning pattern).

account_number: "576391551"   # Robinhood "Agentic" cash account (agentic_allowed=true, option_level_2)
timezone: America/New_York

# SINGLE symbol. June out-of-sample showed SPY/QQQ/IWM scores cross the threshold
# together (same market factor), so a 3-symbol book was one leveraged bet that
# stopped out as a unit. SPY chosen: tightest 0DTE spreads (lowest unmodeled
# slippage) and it traded 37% less often than QQQ at the same threshold.
# June per-symbol: SPY -$1,009 (19 trades) · QQQ -$1,379 (30) · IWM -$2,712 (33).
universe: [SPY]

schedule:            # all times US/Eastern
  sentiment_start: "09:00"
  market_open: "09:30"
  entry_earliest: "09:45"   # owner's choice. Backtest 07/13-07/24 across 9:35/9:45/9:50/10:00
                            # was inconclusive (spread was noise); 9:35 is the one ruled OUT
                            # structurally — one bar makes drive/range_pos pure noise.
  entry_latest: "11:30"     # no new entries after this
  # HARD CLOSE REMOVED (owner decision). Positions are no longer flattened intraday;
  # they are held across sessions and exited by stop / target / time-stop (see risk:).
  eod_verify: "15:45"       # before the close: confirm every open position has a
                            # WORKING GTC stop, and check the time-stop / DTE rules.
  failsafe_check: "16:10"   # after the close: independent re-verification

signal:
  entry_threshold: 40       # |symbol score| needed to trade that symbol (score range -100..+100)
  entry_persistence_min: 3  # *** REAL, GATING RULE, added 2026-08-07 (owner decision: "Make P=3
                            # for now, the longer it waits, is avoiding the upward trend") ***
                            # An entry additionally requires |score| >= entry_threshold for this
                            # many CONSECUTIVE minutes (same sign), measured on BACKFILLED
                            # 1-minute bars via `strategy_calc.py persistence` — NOT on polling
                            # checks (a session polling every ~7 min must backfill minute bars and
                            # evaluate the trailing series at each entry check; the gate is
                            # cadence-independent by construction). Entry at/after the P-th
                            # qualifying minute, never after entry_latest (11:30:00 ET inclusive,
                            # later exclusive). Motivation: minute-level replay of 7/24-8/7 showed
                            # every winning entry's signal held >=40 for 10+ consecutive minutes,
                            # while 1-2 minute spikes (8/6 10:18 +41.7, 8/7 10:25 +40.8) were
                            # noise; on that sample P=3 delays winners only 2-4 minutes and
                            # filters the pure spikes. P=3 (not a stricter 10-15) is the owner's
                            # explicit chase-vs-filter tradeoff: the June/July checkpoint
                            # backtests (logs/backtest/entry_confirmation_test.md) showed STRICT
                            # 15-30 min confirmation is unsupported — its apparent gains are
                            # noise/regime artifacts and it delayed July's only correct entry
                            # into a loser. Unvalidated at exactly P=3 beyond the forward replay;
                            # same caveat as every recently-adopted parameter.
  gap_limit_pct: 1.5        # skip the day if overnight gap exceeds this (unstable regime)
  vix_max: 35               # skip the day if VIX is above this
  per_symbol_entries: true  # each universe symbol qualifies independently, in its own direction
  # allow_mixed_directions is moot with a single-symbol universe (one position at a time).
  velocity_watch_pts_per_min: 1.0  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** score
                             # rate-of-change (points/minute) worth flagging in the journal.
                             # Added 2026-07-27: the level-only gate (entry_threshold) missed a
                             # real, fast -21.8 -> -30.6 move in 12 min because it never crossed
                             # +/-40. Unvalidated starting guess, not a tuned threshold — see
                             # `strategy_calc.py velocity` and logs/backtest/ once evidence exists.
  acceleration_watch_pts_per_min2: 0.5  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** 2nd
                             # derivative — change in velocity per minute (points/min^2).
                             # Flags when a move is speeding up or reversing, not just moving.
                             # Also an unvalidated starting guess — see `strategy_calc.py velocity
                             # --velocity-prev`.
  option_velocity_watch_usd_per_min: 0.01    # *** DIAGNOSTIC, DOES NOT GATE ANYTHING ***
                             # same velocity/acceleration math, applied to 0DTE call AND put
                             # MID PRICE (dollars, not -100..100 points — hence separate
                             # thresholds; pass via `velocity --watch-threshold`). Tracked
                             # every flat re-check for BOTH directions regardless of which
                             # way the sentiment score points — extends the existing
                             # shadow-0DTE-leg snapshot into a continuous forward series.
                             # Lowered from 0.05 on 2026-07-28 (owner request): the original
                             # threshold filtered out most of that session's real but modest
                             # cycle-to-cycle moves (e.g. -0.016, +0.0425, +0.03 $/min all
                             # went unlogged 10:16-11:20), leaving a gap in the record even
                             # though the underlying moved substantially in that window.
                             # Still not zero — a leg with a truly unchanged quote between
                             # polls stays unlogged, but real movement should now show up.
  option_acceleration_watch_usd_per_min2: 0.005  # as above, 2nd derivative; lowered from
                             # 0.02 on 2026-07-28 for the same reason.
  vix_change_watch_pts_per_day: 5.0  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** day-over-day
                             # VIX change (points, today's Phase-1 level vs prior day's close)
                             # worth flagging. Added 2026-08-04 (owner request) after discussing
                             # the June out-of-sample backtest: the static `vix_max` level gate
                             # never got tested against real historical VIX (unavailable to that
                             # backtest), and June's worst 3 days (-$3,761 of the -$5,100 total)
                             # were flagged only as "plausibly" high-VIX — a LEVEL a filter might
                             # have caught, not necessarily a JUMP. Rationale for tracking rate of
                             # change too: a fast VIX spike can signal a regime shift into exactly
                             # the mean-reversion/whipsaw conditions this momentum-continuation
                             # signal loses money in (see logs/backtest/2026-06_out_of_sample.md),
                             # even on a day where the absolute level hasn't crossed vix_max yet.
                             # Reuses the existing generic `strategy_calc.py velocity` command
                             # (--score-now <today's VIX> --score-prev <yesterday's close>
                             # --minutes-elapsed 1 --watch-threshold 5.0) — no new script code.
                             # NOTE: --minutes-elapsed 1 means "1 day-step", not one minute —
                             # passing the literal 1440 minutes/day dilutes the per-minute rate
                             # so `notable` never fires at a sane threshold. See docs/PLAYBOOK.md
                             # Phase 1 step 1b for the worked-through reasoning.
  vix_acceleration_watch_pts_per_day2: 3.0  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** 2nd
                             # derivative of VIX — is the day-over-day change ITSELF getting
                             # bigger (accelerating) or smaller (decelerating), same 2nd-
                             # derivative math as acceleration_watch_pts_per_min2 above, applied
                             # to vix_change_watch_pts_per_day. Added 2026-08-04 (owner request,
                             # same conversation as vix_change_watch_pts_per_day) — a VIX jump
                             # that is itself accelerating (e.g. +2.6 pts one day, +6.4 the next)
                             # is a stronger regime-shift signal than either single day-over-day
                             # reading alone. Reuses `strategy_calc.py velocity --velocity-prev
                             # <yesterday's day-over-day delta>` — no new script code. Requires
                             # ONE extra day of VIX history (T-2) at Phase 1 to compute yesterday's
                             # velocity as the --velocity-prev input; see docs/PLAYBOOK.md step 1b.
                             # Unvalidated starting guess, zero backtest evidence, same caveat as
                             # every other *_watch_* parameter in this file.
  vix_change_watch_pct_per_day: 15.0  # *** DIAGNOSTIC, DOES NOT GATE ENTRIES *** day-over-day
                             # VIX change as a PERCENTAGE of the prior close, not just points.
                             # Added 2026-08-04 (owner request, same conversation) — points and
                             # percent capture different things because VIX's typical range (10s
                             # to 40s) means a fixed point move is far more significant relatively
                             # at a low VIX baseline than a high one: +5 pts from a VIX of 12 is
                             # +41.7% (extreme), +5 pts from a VIX of 30 is +16.7% (still notable,
                             # less extreme). Required strategy_calc.py velocity to gain a
                             # `pct_change` field + optional `--pct-watch-threshold` (previously
                             # velocity only reported absolute delta/points-per-minute) — the new
                             # field has NO config-driven default the way --watch-threshold does,
                             # since percentage change is not meaningful for the -100..100
                             # sentiment score (crosses zero routinely) and must be opted into
                             # explicitly per call. Pass via `velocity --pct-watch-threshold 15.0`
                             # alongside the points-based call in docs/PLAYBOOK.md step 1b.
                             # Unvalidated starting guess, zero backtest evidence, same caveat as
                             # every other *_watch_* parameter in this file.
                             # Unvalidated starting guess, zero backtest evidence for 5.0 pts/day
                             # specifically, same caveat as every other *_watch_* parameter above.
                             # DIAGNOSTIC ONLY per house convention: log it, do not act on it,
                             # until real evidence justifies promoting it to a gating rule (same
                             # path consider_exit_pct followed 2026-07-29 -> 2026-07-30). Intraday
                             # VIX velocity (re-poll during the session, not just once at 9:00 ET)
                             # is a natural next step if this proves useful — not built yet.

risk:
  max_premium_per_trade_usd: 1000  # max premium outlay on one position. *** THIS IS A
                                   # CAP, NOT AN ENTITLEMENT *** Buying power on this
                                   # account is shared with other agentic strategies
                                   # (owner, 2026-08-17: an equity-basket strategy now
                                   # deploys the cash balance). Effective budget =
                                   # min(this cap, live get_portfolio buying_power),
                                   # read fresh immediately before sizing every entry.
                                   # 2026-08-17 reference: cash $11,858.54 but buying
                                   # power $60.54 — $11,798 reserved by 10 queued
                                   # agentic equity buys. At that level this strategy
                                   # cannot fund any entry; that is a
                                   # `blocked - insufficient buying power` signal, not
                                   # a reason to bend sizing or stop rules.
  # --- Paper capital (owner, 2026-08-17) ---------------------------------------
  # "this strategy will only do test run, not with real money, just copy the account
  # balance now and continue with this number." So sizing uses a FIXED snapshot of the
  # account balance instead of live buying power. This deliberately decouples the
  # strategy from the equity-basket strategy's cash reservations, which had left real
  # buying_power at $60.54 and would otherwise have locked out every entry.
  # Paper equity COMPOUNDS with hypothetical P&L (owner, 2026-08-17: "embed the P&L
  # on to the paper balance"). The balance is no longer a static number in this file —
  # it lives in the ledger and is computed, never hand-edited:
  #     data/paper_ledger.json   starting balance + one row per realized paper trade
  #     scripts/strategy_calc.py paper   ->  paper_equity_usd, sizing_budget_usd
  # starting_balance_usd 11858.54 = real account snapshot, 2026-08-17 pre-open.
  # Effective budget in dry_run = min(max_premium_per_trade_usd, paper_equity_usd),
  # which `paper` reports directly as sizing_budget_usd. At current equity the $1,000
  # cap binds, so sizing is unaffected by the other strategies' cash reservations.
  # Unrealized P&L on an open position is REPORTING ONLY and is never added to the
  # budget — an unrealized gain is not spendable, and sizing off it would let one
  # paper position inflate the next one.
  require_live_buying_power_check: true  # REAL, GATING **IN LIVE MODE ONLY**. If mode is
                                   # ever live, no entry may be sized without a fresh
                                   # get_portfolio read in the same wake, and the real
                                   # contested buying power governs — the paper
                                   # ledger is then IGNORED. Cash account: no margin, and
                                   # unsettled proceeds are NOT spendable.
  max_concurrent_positions: 1      # single-symbol universe -> at most one open position
  max_total_premium_usd: 1000      # equals the per-position cap now (only one position can be open)
  max_trades_per_day: 6
  daily_loss_halt_usd: 1000        # ~3.3 full stops at $1,000 sizing (a full stop is ~$300),
                                   # so the halt binds well before the 6-entry cap.
  stop_loss_pct: 30                # core rule: close the position at a 30% loss
  stop_trigger_frac: 0.72          # resting stop triggers at 72% of fill (-28%, margin for slippage)
  stop_time_in_force: gtc          # *** CRITICAL *** With no hard close, the resting stop is the
                                   # ONLY protection on an open position. A gfd stop would expire
                                   # at the close and leave the position naked overnight.
  max_hold_trading_days: 3         # time stop: exit by 13:30 ET on the 3rd trading day after entry
  min_dte_at_exit: 3               # and never hold a contract below 3 DTE (theta cliff / 0DTE risk),
                                   # whichever comes first.
  # No limit floor: the resting stop is a stop-MARKET order. A stop-limit can gap
  # straight through its floor and never fill, leaving the position unprotected;
  # stop-market guarantees the exit at an unbounded price. Fill > no fill.
  take_profit_pct: 30              # *** HARD EXIT, same mechanism as the old +60% ***
                                   # monitored (not resting — one working sell order at a time).
                                   # Lowered from 60 on 2026-07-29 (owner request) after that
                                   # day's SPY 740P: +40.6% unrealized at 12:15 ET round-tripped
                                   # all the way to a -28.96% stop-out by 14:45 ET on an FOMC-
                                   # driven reversal. +60% was set from the July 0DTE backtest
                                   # (logs/backtest/2026-07-13_to_2026-07-24.md), where median
                                   # MFE was only +13.4% at 7DTE and the +60% target was reached
                                   # just 2/19 times — i.e. it was already rarely the binding
                                   # exit; most trades ran to time/DTE. Retested June+July 2026
                                   # on regenerated real-data SPY 7DTE trades: supportive on June
                                   # (+$124 vs -$1,371 counterfactual under +60%), null on July
                                   # (nothing ever got close to either target that week) — see
                                   # logs/backtest/take_profit_30pct_test.md. 22 trades, thin;
                                   # not treated as settled.
  # TRAILING STOP REMOVED 2026-08-07 (owner decision — "proceed with takeaway 2",
  # logs/analysis/2026-08-07_forward_review.md finding 4). The consider_exit_pct
  # (+10% activation) / trail_stop_distance_pct (14pp trail) pair that lived here
  # was live 2026-07-30 -> 2026-08-07 and NEVER FIRED in 8 forward trades: in the
  # 5 winners the +30% take_profit always arrived first, and in the 3 losers the
  # peak never reached the +10% activation. Under a +30% TP it is mathematically
  # near-dead code: activation +10% with a 14pp trail only locks in better than
  # breakeven when peak gain > +24%, and TP fires at +30% — the protective band
  # is a sliver. Exits are now: static -28% stop (stop_trigger_frac), +30%
  # take_profit, time stop / DTE floor, daily halt, and the EOD carry gate below.
  # If a future re-parameterization is wanted (e.g. lower activation), it needs a
  # real backtest first — a tighter trail would likely have killed the 2026-07-30
  # winner during its -20% trough en route to +32%.
  eod_carry_min_unrealized_pct: -14  # *** REAL, GATING RULE, added 2026-08-07 (owner decision —
                                   # "proceed with takeaway 3") *** Phase 5 overnight-carry gate:
                                   # at the 15:45 ET verification, any open position whose
                                   # unrealized P&L is at or below this level is CLOSED before
                                   # 16:00 (cancel stop, bid-pegged limit) instead of carried
                                   # overnight. Rationale: a position this far down has under
                                   # half the -28% stop width left as cushion, and June data
                                   # showed overnight gaps filling stops as bad as -56/-58%
                                   # (logs/backtest/take_profit_30pct_test.md — 27% of stop
                                   # fills meaningfully through the trigger). -14 chosen as half
                                   # the stop width (same convention as the removed 14pp trail).
                                   # Positions above the floor carry as designed with the GTC
                                   # stop. Unvalidated starting guess, zero backtest evidence
                                   # for -14 specifically; journal every gate decision. Computed
                                   # as `eod_carry_floor` by `strategy_calc.py stops --fill F`.
                                   # NOTE: no position has ever actually carried overnight yet
                                   # (all 8 forward trades resolved intraday) — this rule exists
                                   # so the first carry decision is principled, not improvised.

monitoring:
  # Both raised 1 -> 5 on 2026-08-14 (owner decision: "change to 5 minutes first")
  # after the wake-delivery audit in logs/analysis/2026-08-14_wake_delivery_audit.md.
  # The 1-minute cadence was never actually achieved: measured delivery on 2026-08-14
  # was one wake per ~30-50 min, two triggers were stranded permanently (never fired,
  # still enabled hours past due), and deliveries arrived OUT OF ORDER. Scheduling
  # more triggers did not buy more wakes — it appears to have made stranding worse,
  # including stranding the fallback backup wake that was armed to catch exactly this.
  # Net effect that day: a fully-qualifying 11:21 ET put entry sat inside the entry
  # window for 9 minutes and went unactioned (logs/journal/2026-08-14.md).
  # 5 minutes is a FIRST STEP, not the validated answer: it cuts trigger-creation
  # density 5x while keeping far better resolution than the ~20-min cadence the
  # 2026-08-12 audit found delivers reliably (sub-1-min lag). If 5 min still shows
  # stranding or >10 min lag, step down again toward 20. Each wake must now backfill
  # and REPLAY the whole interval per-minute rather than trusting the endpoint score —
  # that is what preserves minute-resolution signal detection at a slower poll rate.
  interval_open_minutes: 5    # wake every 5 min while any position is open
  interval_flat_minutes: 5    # signal re-checks every 5 min when flat, same as when open

contract:
  # SHADOW LEG (dry-run diagnostic, never traded): for every signal, also record the
  # equivalent contract at this DTE so the 0DTE-vs-7DTE question gets answered on
  # forward out-of-sample data. The June comparison (logs/backtest/dte_comparison.md)
  # favoured 7DTE, but June was mean-reverting while July's best days came from 0DTE
  # convexity — that ranking is likely regime-dependent and needs fresh evidence.
  shadow_dte: 0             # set to null to stop recording the shadow leg
  dte_target: 7             # nearest expiration >= 7 CALENDAR days out (was 0DTE).
                            # If +7 is a weekend/holiday, take the next available
                            # expiration; never take one below dte_target - 1.
  min_premium: 0.15         # skip contracts under $0.15/share — fills are spread-dominated
  target_delta_min: 0.45    # at 7DTE this is ~1-2 strikes OTM — the contracts actually
  target_delta_max: 0.55    # tested in logs/backtest/dte_comparison.md. Use real greeks
                            # from get_option_quotes; do not reuse the 0DTE strike offsets.
  max_spread_pct_of_mid: 10 # skip contracts with wide bid/ask
  min_open_interest: 250    # Lowered from 500 on 2026-08-07 (owner decision — "proceed with
                            # takeaway 1", logs/analysis/2026-08-07_forward_review.md finding 5).
                            # At 500 the filter killed or delayed ~3 of only ~11 genuine
                            # threshold crossings in the 7/24-8/7 forward period, including
                            # 2026-08-05's ONLY qualifying signal (all four delta-band strikes
                            # rejected at OI 331/267/214/168 — two of those pass at 250). The
                            # spread (max_spread_pct_of_mid) and min_volume checks below are the
                            # filters that actually protect fill quality and are unchanged.
                            # Watch forward: if fills degrade at OI 250-500 contracts, revert.
  min_volume: 100

cash_account:
  fund_only_from_settled_cash: true   # size against start-of-day settled cash
  no_reuse_of_same_day_proceeds: true # avoid good-faith violations

journal:
  branch: claude/robinhood-day-options-strategy-y8eskp
  dir: logs/journal
