# 0DTE index options strategy — all tunable parameters.
# The scheduled session reads this file at 9:00 ET every trading day.

# dry_run: full signal pipeline + journaling, but NO orders are placed.
# live:    orders are placed automatically within the limits below.
#          Setting "live" is the account owner's standing authorization for
#          scheduled agent sessions to trade without per-order confirmation.
mode: live

account_number: "576391551"   # Robinhood "Agentic" cash account (agentic_allowed=true, option_level_2)
timezone: America/New_York

# ETFs with daily (0DTE) expirations. IWB has no daily expirations; IWM stands in.
universe: [SPY, QQQ, IWM]

schedule:            # all times US/Eastern
  sentiment_start: "09:00"
  market_open: "09:30"
  entry_earliest: "09:45"   # skip the first 15 min of open chop
  entry_latest: "11:30"     # no new risk after this — trades need room before the 13:00 close
  hard_close_start: "13:00"
  hard_close_deadline: "13:30"
  failsafe_check: "13:31"

signal:
  entry_threshold: 40       # |composite score| needed to trade (score range -100..+100)
  gap_limit_pct: 1.5        # skip the day if overnight gap exceeds this (unstable regime)
  vix_max: 35               # skip the day if VIX is above this
  min_agreement: 2          # at least 2 of 3 universe symbols must agree on direction

risk:
  max_premium_per_trade_usd: 400   # max total premium outlay on one entry
  max_trades_per_day: 2
  max_concurrent_positions: 1
  daily_loss_halt_usd: 350         # stop trading for the day once realized losses reach this
  stop_loss_pct: 30                # core rule: close the position at a 30% loss
  stop_trigger_frac: 0.72          # resting stop triggers at 72% of fill (-28%, margin for slippage)
  stop_limit_frac: 0.65            # stop's limit floor at 65% of fill (-35% worst case)
  take_profit_pct: 60              # monitored (not resting — one working sell order at a time)

contract:
  target_delta_min: 0.35    # slightly OTM; balances cost vs responsiveness
  target_delta_max: 0.45
  max_spread_pct_of_mid: 10 # skip contracts with wide bid/ask
  min_open_interest: 500
  min_volume: 100

cash_account:
  fund_only_from_settled_cash: true   # size against start-of-day settled cash
  no_reuse_of_same_day_proceeds: true # avoid good-faith violations

journal:
  branch: claude/robinhood-day-options-strategy-y8eskp
  dir: logs/journal
